name: Deploy Corabras (Monorepo) via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 — Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Upload de Telhas via FTP
      - name: Deploy Telhas via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./telhas/
          server-dir: /telhas/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **telhas.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php
            **/vendor/**

      # 3 — Upload de Blocos via FTP
      - name: Deploy Blocos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./blocos/
          server-dir: /blocos/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **blocos.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php
            **/vendor/**

      # 4 — Upload de dfTelhas via FTP
      - name: Deploy dfTelhas via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./dftelhas/
          server-dir: /dftelhas/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **dfTelhas.sln**
            **dfTelhas.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php
            **/vendor/**

      # 5 — Upload Portal (index.html) para Raiz /
      - name: Deploy Portal Landing Page para Raiz /
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./
          server-dir: /
          exclude: |
            **/telhas/**
            **/blocos..com.br/**
            **/dftelhas/**
            **/docker/**
            **docker-compose.yml**
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/*.code-workspace
            **/.vscode/**
            **/.settings/**

      # 6 — Upload Portal (index.html) para /pedidoscorabras.com.br/
      - name: Deploy Portal Landing Page para /pedidoscorabras.com.br/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/telhas/**
            **/blocos/**
            **/dftelhas/**
            **/docker/**
            **docker-compose.yml**
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/*.code-workspace
            **/.vscode/**
            **/.settings/**
