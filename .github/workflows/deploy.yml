name: Deploy Corabras (Monorepo) via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 — Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Instalação do PHP e Composer no Runner do GitHub
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, zip, pdo_mysql, gd
          tools: composer:v2

      # 3 — Instalação limpa de dependências (Composer) para Telhas
      - name: Composer Install Telhas
        run: |
          cd telhas
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # 4 — Instalação limpa de dependências (Composer) para Blocos
      - name: Composer Install Blocos
        run: |
          cd blocos
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # 5 — Instalação de dependências (Composer) para dfTelhas
      - name: Composer Install dfTelhas
        run: |
          cd dftelhas
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --ignore-platform-reqs || true

      # 6 — Upload de Telhas via FTP (com vendor limpo)
      - name: Deploy Telhas via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./telhas/
          server-dir: /telhas/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **telhas.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php

      # 7 — Upload de Blocos via FTP (com vendor limpo)
      - name: Deploy Blocos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./blocos/
          server-dir: /blocos/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **blocos.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php

      # 8 — Upload de dfTelhas via FTP (com vendor limpo)
      - name: Deploy dfTelhas via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./dftelhas/
          server-dir: /dftelhas/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **dfTelhas.sln**
            **dfTelhas.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php

      # 9 — Upload Portal (index.html) para /public_html/
      - name: Deploy Portal Landing Page para /public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/telhas/**
            **/blocos/**
            **/dftelhas/**
            **/docker/**
            **docker-compose.yml**
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/*.code-workspace
            **/.vscode/**
            **/.settings/**
