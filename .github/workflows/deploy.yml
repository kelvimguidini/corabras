name: Deploy Corabras (Monorepo) via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 — Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Instalação do PHP e Composer no Runner do GitHub
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, zip, pdo_mysql, gd
          tools: composer:v2

      # 3 — Instalação e empacotamento das dependências para Telhas
      - name: Build e Zip Vendor Telhas
        run: |
          cd telhas
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          cd vendor
          zip -r -q ../public/packages.zip .
          cd ../..

      # 4 — Instalação e empacotamento das dependências para Blocos
      - name: Build e Zip Vendor Blocos
        run: |
          cd blocos
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          cd vendor
          zip -r -q ../public/packages.zip .
          cd ../..

      # 5 — Instalação e empacotamento das dependências para dfTelhas
      - name: Build e Zip Vendor dfTelhas
        run: |
          cd dftelhas
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --ignore-platform-reqs || true
          if [ -d "vendor" ]; then
            cd vendor
            zip -r -q ../public/packages.zip .
            cd ../..
          fi

      # 6 — Upload de Telhas via FTP
      - name: Deploy Telhas via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./telhas/
          server-dir: /telhas/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **telhas.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php
            **/vendor/**

      # 7 — Upload de Blocos via FTP
      - name: Deploy Blocos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./blocos/
          server-dir: /blocos/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **blocos.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php
            **/vendor/**

      # 8 — Upload de dfTelhas via FTP
      - name: Deploy dfTelhas via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./dftelhas/
          server-dir: /dftelhas/
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **dfTelhas.sln**
            **dfTelhas.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php
            **/vendor/**

      # 9 — Upload Portal (index.html) para /public_html/
      - name: Deploy Portal Landing Page para /public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/telhas/**
            **/blocos/**
            **/dftelhas/**
            **/docker/**
            **docker-compose.yml**
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/*.code-workspace
            **/.vscode/**
            **/.settings/**

      # 10 — Extrai o Vendor automaticamente na hospedagem
      - name: Auto-Extrair Vendor no Servidor
        run: |
          echo "Extraindo vendor em Telhas..."
          curl -k -sL --resolve "https://corabras.frii.site:80:${{ secrets.FTP_SERVER }}" --resolve "telhas.pedidoscorabras.com.br:443:${{ secrets.FTP_SERVER }}" "http://telhas.pedidoscorabras.com.br/extract_vendor.php?token=corabras_deploy_secret_2026" || curl -k -sL "http://corabras.frii.site/extract_vendor.php?token=corabras_deploy_secret_2026" || true
          echo "Extraindo vendor em Blocos..."
          curl -k -sL --resolve "https://corabras.frii.site:80:${{ secrets.FTP_SERVER }}" --resolve "blocos.pedidoscorabras.com.br:443:${{ secrets.FTP_SERVER }}" "http://blocos.pedidoscorabras.com.br/extract_vendor.php?token=corabras_deploy_secret_2026" || true
          echo "Extraindo vendor em dfTelhas..."
          curl -k -sL --resolve "https://corabras.frii.site:80:${{ secrets.FTP_SERVER }}" --resolve "dftelhas.pedidoscorabras.com.br:443:${{ secrets.FTP_SERVER }}" "http://dftelhas.pedidoscorabras.com.br/extract_vendor.php?token=corabras_deploy_secret_2026" || true
