name: Deploy ZF2 via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 — Checkout do repositório
      - name: Checkout repository 
        uses: actions/checkout@v3

      # 2 — Setup PHP usado pelo Composer
      - name: Setup PHP (8.2)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, curl, dom, xml, json

      # 3 — Instalar dependências incluindo DOCTRINE DBAL 2
      - name: Install Composer dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader

      # 4 — Upload do Projeto via FTP
      - name: Upload Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/storage/**
            **/tmp/**
            **/.env**
            **vite.config.js**
            **nginx.conf**
            **docker-compose.yml**
            **Dockerfile**
            **docker/**
            **.dockerignore**
            **telhas.code-workspace**
            **/config/autoload/*.local.php
            **/config/autoload/doctrine.local.php
